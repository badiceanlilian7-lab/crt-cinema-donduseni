services:
  - type: web
    name: crt-cinema-backend
    env: node
    buildCommand: npm install && cd client && npm install && npm run build
    startCommand: node server/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
    disk:
      name: uploads
      mountPath: /opt/render/project/server/uploads
      sizeGB: 1
